services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-usermoon}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-usermoon}
    volumes:
      - usermoon-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 8s
      timeout: 5s
      retries: 20

  mongo:
    image: docker.m.daocloud.io/library/mongo:7
    restart: unless-stopped
    volumes:
      - usermoon-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 8s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/site.Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:4173"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-usermoon}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-usermoon}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-usermoon}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  usermoon-mysql:
  usermoon-mongo:
